# Netlify detects Next.js and applies its maintained OpenNext adapter.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.16.0"
  # The app uses browser localStorage as its primary store. Disable the optional
  # SQLite mirror on Netlify because Function filesystems are not shared/persistent.
  NEXT_PUBLIC_DB_SYNC_ENABLED = "false"
